# Serves the built frontend and passes /api to the backend container (same origin, so no CORS involved).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Story text is at most 500 characters; nothing bigger has a reason to come in.
    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended: the backend (TRUST_PROXY=true) must see the real peer, not a client-sent value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # File names carry a content hash: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /mock/ {
        types { model/gltf-binary glb; text/markdown md; }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Single-page app: every other address is answered by index.html, which must not be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
