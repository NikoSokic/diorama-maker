services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: diorama
      POSTGRES_USER: ${DB_USER:?postavi DB_USER u .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?postavi DB_PASSWORD u .env}
    ports:
      - "5432:5432"
    volumes:
      - diorama-pgdata:/var/lib/postgresql/data

volumes:
  diorama-pgdata:
