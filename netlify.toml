# Static frontend on Netlify (free). See docs/DEPLOY.md. API_ORIGIN is set in the Netlify UI.
[build]
  base = "frontend"
  command = "npm ci && npm run build && node scripts/write-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets never change; the HTML always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
