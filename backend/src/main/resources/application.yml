spring:
  application:
    name: diorama
  config:
    # Loads the repo-root .env automatically (works from /backend and from the repo root).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      # Supabase free tier: keep the pool small (session pooler has a low client limit).
      maximum-pool-size: 5
      minimum-idle: 1
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  # free hosts (Render, Fly, Railway) say which port to listen on in PORT
  port: ${PORT:8080}
  shutdown: graceful
  # Story JSON and locally served models (mock mode) go out gzipped; live models come from the Supabase CDN.
  compression:
    enabled: true
    mime-types: application/json,model/gltf-binary
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

diorama:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  max-stories-per-ip-per-day: ${MAX_STORIES_PER_IP_PER_DAY:5}
  # changing place / time / weather of a finished story (cheap: no Gemini, cached models)
  max-tweaks-per-ip-per-day: ${MAX_TWEAKS_PER_IP_PER_DAY:20}
  ip-hash-salt: ${IP_HASH_SALT:}
  # Optional: protects GET /api/credits when called from a non-local address (X-Admin-Token header).
  admin-token: ${ADMIN_TOKEN:}
  trust-proxy: ${TRUST_PROXY:false}
  # Number of trusted proxies that append to X-Forwarded-For; the client IP is read that many entries from the right.
  trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  # Loopback callers are exempt from the per-IP story limit unless this is true.
  rate-limit-loopback: ${RATE_LIMIT_LOOPBACK:false}
  # gallery thumbnails captured by the creator's player (checked by Gemini vision when Gemini is live)
  thumbnail-uploads: ${THUMBNAIL_UPLOADS:true}
  tripo:
    api-key: ${TRIPO_API_KEY:}
    base-url: ${TRIPO_BASE_URL:https://openapi.tripo3d.ai/v3}
    # mock | live — mock is the default; live spends real credits.
    mode: ${TRIPO_MODE:mock}
    enable-rigging: ${ENABLE_RIGGING:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # live | mock — mock uses the offline planner (also used automatically when the key is missing).
    mode: ${GEMINI_MODE:live}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    # generated narrator voice (free tier); off = the browser reads the story
    tts: ${GEMINI_TTS:on}
    tts-model: ${GEMINI_TTS_MODEL:gemini-3.8-flash-tts}
    tts-voice: ${GEMINI_TTS_VOICE:Kore}
    tts-daily-limit: ${GEMINI_TTS_DAILY_LIMIT:150}
  storage:
    # auto | supabase | local
    mode: ${STORAGE_MODE:auto}
  supabase:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:models}
